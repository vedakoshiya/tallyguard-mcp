name: TallyGuard MCP CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Evaluation Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite (All 76 Tests)
        run: |
          pytest -v --cov=server --cov=bridge --cov-report=term-missing

      - name: Run 100-Task Agent Evaluation Benchmark
        run: |
          python tests/agent_eval/eval_runner.py
