[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallyguard-mcp"
version = "0.1.0"
description = "Governed Model Context Protocol (MCP) server for safe, read-reconciled, and draft-only AI assistant access to Tally accounting data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Veda Koshiya", email = "koshiyaveda@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "tally",
    "tally-prime",
    "accounting",
    "governance",
    "ai-safety",
    "fintech"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Security"
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0"
]

[project.scripts]
tallyguard = "server.main:run"
tallyguard-bridge = "bridge.main:run"

[tool.hatch.build.targets.wheel]
packages = ["server", "bridge"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
